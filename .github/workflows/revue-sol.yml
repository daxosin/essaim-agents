# Revue automatique de chaque PR par GPT-6.1 Sol (skill avocat-du-diable, mode audit).
# Prérequis : secret de dépôt OPENROUTER_API_KEY. Autre modèle : variable de dépôt AVOCAT_MODELE (défaut : sol).
name: Revue Sol
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  revue:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests
        run: node --test "tests/*.test.mjs"
      - name: Revue
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BASE: ${{ github.event.pull_request.base.sha }}
          MODELE: ${{ vars.AVOCAT_MODELE || 'sol' }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then echo "Secret OPENROUTER_API_KEY absent : revue ignorée."; exit 0; fi
          ARGS=()
          while IFS= read -r -d '' f; do ARGS+=(--fichier "$f"); done < <(git diff -z --name-only --diff-filter=AM "$BASE" HEAD -- '*.md' '*.mjs' '*.ps1' '*.yml')
          if [ ${#ARGS[@]} -eq 0 ]; then echo "Aucun fichier à revoir."; exit 0; fi
          node outils/avocat.mjs --modele "$MODELE" --mode audit "${ARGS[@]}" --sujet pr --confirme-anonymise \
            --contexte "Dépôt de skills et d'outils pour essaims de sous-agents Claude. Critères : exactitude, robustesse en concurrence, sécurité (secrets, injection de chemins), cohérence entre les skills et les outils, portabilité Windows."
      - name: Commentaire
        if: hashFiles('_avocat/pr/journal.jsonl') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo "## Revue automatique — avocat du diable"; for f in _avocat/pr/*-audit.md; do echo; cat "$f"; done; } > revue.md
          gh pr comment "$PR" --body-file revue.md
